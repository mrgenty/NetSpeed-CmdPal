name: Build NetSpeed

on:
  push:
    branches:
      - main
    tags:
      - "v*"

  workflow_dispatch:

permissions:
  contents: write

env:
  DOTNET_VERSION: "10.0.x"
  PROJECT_PATH: "NetSpeed/NetSpeed.csproj"
  LIBRESPEED_VERSION: "1.0.13"

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: windows-latest

    env:
      PFX_BASE64: ${{ secrets.NETSPEED_PFX_BASE64 }}
      PFX_PASSWORD: ${{ secrets.NETSPEED_PFX_PASSWORD }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: x64
            runtime: win-x64
            librespeed_arch: amd64
          - platform: ARM64
            runtime: win-arm64
            librespeed_arch: arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore NuGet packages
        shell: pwsh
        run: |
          dotnet restore "${{ env.PROJECT_PATH }}"
          if ($LASTEXITCODE -ne 0) {
            throw "dotnet restore failed."
          }

      - name: Download LibreSpeed CLI
        shell: pwsh
        timeout-minutes: 5
        run: |
          $version = "${{ env.LIBRESPEED_VERSION }}"
          $arch = "${{ matrix.librespeed_arch }}"

          $file = "librespeed-cli_${version}_windows_${arch}.zip"
          $baseUrl = "https://github.com/librespeed/speedtest-cli/releases/download/v${version}"
          $zipUrl = "$baseUrl/$file"
          $checksumsUrl = "$baseUrl/checksums.txt"

          Write-Host "Downloading LibreSpeed CLI $version for $arch"

          Invoke-WebRequest -Uri $zipUrl -OutFile $file
          Invoke-WebRequest -Uri $checksumsUrl -OutFile "checksums.txt"

          $checksumLine = Get-Content "checksums.txt" |
            Where-Object { $_ -match [regex]::Escape($file) } |
            Select-Object -First 1

          if (-not $checksumLine) {
            throw "Checksum for $file not found."
          }

          $expected = ($checksumLine -split '\s+')[0].Trim().ToLowerInvariant()
          $actual = (Get-FileHash -Path $file -Algorithm SHA256).Hash.ToLowerInvariant()

          Write-Host "Expected SHA256: $expected"
          Write-Host "Actual SHA256:   $actual"

          if ($expected -ne $actual) {
            throw "LibreSpeed CLI checksum mismatch."
          }

          $target = "NetSpeed\ThirdParty\LibreSpeed"

          Remove-Item -Path $target -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $target | Out-Null

          Expand-Archive -Path $file -DestinationPath $target -Force

          Invoke-WebRequest `
            -Uri "https://raw.githubusercontent.com/librespeed/speedtest-cli/v${version}/LICENSE" `
            -OutFile "$target\LICENSE-LGPL-3.0.txt"

          if (-not (Test-Path "$target\LICENSE-LGPL-3.0.txt")) {
            throw "LibreSpeed license was not downloaded."
          }

          Write-Host "LibreSpeed files:"
          Get-ChildItem -Path $target -Recurse | Select-Object FullName, Length

      - name: Build MSIX
        shell: pwsh
        timeout-minutes: 15
        run: |
          Write-Host "Building NetSpeed for ${{ matrix.platform }}..."

          dotnet publish "${{ env.PROJECT_PATH }}" `
            -c Release `
            -p:Platform=${{ matrix.platform }} `
            -r ${{ matrix.runtime }} `
            -p:GenerateAppxPackageOnBuild=true `
            -p:AppxPackageSigningEnabled=false

          if ($LASTEXITCODE -ne 0) {
            throw "dotnet publish failed."
          }

      - name: Find generated MSIX
        id: package
        shell: pwsh
        run: |
          $msix = Get-ChildItem `
            -Path . `
            -Recurse `
            -Filter "*.msix" `
            -File |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1

          if (-not $msix) {
            throw "No MSIX package was generated."
          }

          Write-Host "MSIX found: $($msix.FullName)"
          "path=$($msix.FullName)" >> $env:GITHUB_OUTPUT
          "filename=$($msix.Name)" >> $env:GITHUB_OUTPUT

      - name: Verify release signing secrets
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:PFX_BASE64)) {
            throw "NETSPEED_PFX_BASE64 is missing."
          }

          if ([string]::IsNullOrWhiteSpace($env:PFX_PASSWORD)) {
            throw "NETSPEED_PFX_PASSWORD is missing."
          }

          Write-Host "Persistent release signing certificate configured."

      - name: Restore persistent signing certificate
        if: env.PFX_BASE64 != ''
        shell: pwsh
        run: |
          $pfxPath = Join-Path $env:RUNNER_TEMP "NetSpeed-CodeSigning.pfx"

          try {
            $bytes = [Convert]::FromBase64String($env:PFX_BASE64)
          }
          catch {
            throw "NETSPEED_PFX_BASE64 is not valid Base64."
          }

          [IO.File]::WriteAllBytes($pfxPath, $bytes)

          if (-not (Test-Path $pfxPath) -or (Get-Item $pfxPath).Length -eq 0) {
            throw "Unable to reconstruct PFX."
          }

          try {
            $testCert = [System.Security.Cryptography.X509Certificates.X509Certificate2]::new(
              $pfxPath,
              $env:PFX_PASSWORD
            )
          }
          catch {
            throw "Unable to open PFX. Check NETSPEED_PFX_PASSWORD."
          }

          Write-Host "Certificate subject: $($testCert.Subject)"
          Write-Host "Certificate thumbprint: $($testCert.Thumbprint)"

          "SIGNING_PFX=$pfxPath" >> $env:GITHUB_ENV
          "SIGNING_PASSWORD=$env:PFX_PASSWORD" >> $env:GITHUB_ENV

      - name: Validate signing identity
        if: env.PFX_BASE64 != ''
        shell: pwsh
        run: |
          [xml]$manifest = Get-Content "NetSpeed\Package.appxmanifest"
          $publisher = $manifest.Package.Identity.Publisher

          $cert = [System.Security.Cryptography.X509Certificates.X509Certificate2]::new(
            $env:SIGNING_PFX,
            $env:SIGNING_PASSWORD
          )

          Write-Host "Manifest Publisher: $publisher"
          Write-Host "Certificate Subject: $($cert.Subject)"

          if ($publisher -ne $cert.Subject) {
            throw "Certificate Subject does not match Package.appxmanifest Publisher."
          }

      - name: Export public certificate
        if: env.PFX_BASE64 != ''
        shell: pwsh
        run: |
          $cert = [System.Security.Cryptography.X509Certificates.X509Certificate2]::new(
            $env:SIGNING_PFX,
            $env:SIGNING_PASSWORD
          )

          $cerPath = Join-Path $env:RUNNER_TEMP "NetSpeed.cer"
          $certBytes = $cert.Export(
            [System.Security.Cryptography.X509Certificates.X509ContentType]::Cert
          )

          [IO.File]::WriteAllBytes($cerPath, $certBytes)
          "PUBLIC_CERT=$cerPath" >> $env:GITHUB_ENV

      - name: Create temporary CI certificate
        if: env.PFX_BASE64 == '' && !startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          [xml]$manifest = Get-Content "NetSpeed\Package.appxmanifest"
          $publisher = $manifest.Package.Identity.Publisher

          if ([string]::IsNullOrWhiteSpace($publisher)) {
            throw "Unable to read Publisher from Package.appxmanifest."
          }

          $temporaryPassword = [Guid]::NewGuid().ToString("N") + "Aa1!"
          $securePassword = ConvertTo-SecureString $temporaryPassword -AsPlainText -Force

          $cert = New-SelfSignedCertificate `
            -Type Custom `
            -Subject $publisher `
            -KeyAlgorithm RSA `
            -KeyLength 3072 `
            -HashAlgorithm SHA256 `
            -KeyUsage DigitalSignature `
            -FriendlyName "NetSpeed Temporary CI Certificate" `
            -CertStoreLocation "Cert:\CurrentUser\My" `
            -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3")

          $pfxPath = Join-Path $env:RUNNER_TEMP "NetSpeed-Temporary.pfx"
          $cerPath = Join-Path $env:RUNNER_TEMP "NetSpeed-Temporary.cer"

          Export-PfxCertificate -Cert $cert -FilePath $pfxPath -Password $securePassword | Out-Null
          Export-Certificate -Cert $cert -FilePath $cerPath | Out-Null

          "SIGNING_PFX=$pfxPath" >> $env:GITHUB_ENV
          "SIGNING_PASSWORD=$temporaryPassword" >> $env:GITHUB_ENV
          "PUBLIC_CERT=$cerPath" >> $env:GITHUB_ENV

      - name: Locate SignTool
        shell: pwsh
        run: |
          $signtool = Get-ChildItem `
            "C:\Program Files (x86)\Windows Kits\10\bin" `
            -Filter "signtool.exe" `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match "\\x64\\signtool\.exe$" } |
            Sort-Object FullName -Descending |
            Select-Object -First 1

          if (-not $signtool) {
            throw "signtool.exe not found."
          }

          Write-Host "Using SignTool: $($signtool.FullName)"
          "SIGNTOOL=$($signtool.FullName)" >> $env:GITHUB_ENV

      - name: Sign MSIX
        shell: pwsh
        timeout-minutes: 2
        run: |
          Write-Host "Signing: ${{ steps.package.outputs.path }}"

          & "$env:SIGNTOOL" sign `
            /fd SHA256 `
            /f "$env:SIGNING_PFX" `
            /p "$env:SIGNING_PASSWORD" `
            "${{ steps.package.outputs.path }}"

          if ($LASTEXITCODE -ne 0) {
            throw "MSIX signing failed."
          }

      - name: Verify MSIX signature
        shell: pwsh
        timeout-minutes: 2
        run: |
          Write-Host "Preparing temporary certificate trust..."

          $cert = [System.Security.Cryptography.X509Certificates.X509Certificate2]::new(
            $env:PUBLIC_CERT
          )

          $thumbprint = $cert.Thumbprint

          Write-Host "Subject: $($cert.Subject)"
          Write-Host "Thumbprint: $thumbprint"

          $storeNames = @(
            [System.Security.Cryptography.X509Certificates.StoreName]::Root,
            [System.Security.Cryptography.X509Certificates.StoreName]::TrustedPeople
          )

          try {
            foreach ($storeName in $storeNames) {
              $store = [System.Security.Cryptography.X509Certificates.X509Store]::new(
                $storeName,
                [System.Security.Cryptography.X509Certificates.StoreLocation]::CurrentUser
              )

              try {
                $store.Open(
                  [System.Security.Cryptography.X509Certificates.OpenFlags]::ReadWrite
                )
                $store.Add($cert)
                Write-Host "Added certificate to CurrentUser\$storeName"
              }
              finally {
                $store.Close()
              }
            }

            Write-Host "Verifying MSIX..."

            & "$env:SIGNTOOL" verify `
              /pa `
              /v `
              "${{ steps.package.outputs.path }}"

            $verifyExitCode = $LASTEXITCODE

            if ($verifyExitCode -ne 0) {
              throw "MSIX signature verification failed."
            }

            Write-Host "MSIX signature verified successfully."
          }
          finally {
            Write-Host "Removing temporary certificate trust..."

            foreach ($storeName in $storeNames) {
              $store = [System.Security.Cryptography.X509Certificates.X509Store]::new(
                $storeName,
                [System.Security.Cryptography.X509Certificates.StoreLocation]::CurrentUser
              )

              try {
                $store.Open(
                  [System.Security.Cryptography.X509Certificates.OpenFlags]::ReadWrite
                )

                $matches = $store.Certificates.Find(
                  [System.Security.Cryptography.X509Certificates.X509FindType]::FindByThumbprint,
                  $thumbprint,
                  $false
                )

                foreach ($match in $matches) {
                  $store.Remove($match)
                }

                Write-Host "Removed certificate from CurrentUser\$storeName"
              }
              catch {
                Write-Warning "Could not remove certificate from CurrentUser\$storeName"
              }
              finally {
                $store.Close()
              }
            }
          }

      - name: Prepare distribution files
        shell: pwsh
        run: |
          $dist = "dist\${{ matrix.platform }}"

          Remove-Item -Path $dist -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $dist | Out-Null

          $outputName = "NetSpeed_${{ matrix.platform }}.msix"

          Copy-Item "${{ steps.package.outputs.path }}" "$dist\$outputName"
          Copy-Item "$env:PUBLIC_CERT" "$dist\NetSpeed.cer"

          @'
          param(
              [string]$PackagePath
          )

          $ErrorActionPreference = "Stop"
          $scriptDir = Split-Path -Parent $MyInvocation.MyCommand.Path

          if (-not $PackagePath) {
              $PackagePath = Get-ChildItem `
                  -Path $scriptDir `
                  -Filter "*.msix" `
                  -File |
                  Select-Object -First 1 -ExpandProperty FullName
          }

          if (-not $PackagePath) {
              throw "MSIX package not found."
          }

          $certificatePath = Join-Path $scriptDir "NetSpeed.cer"

          if (-not (Test-Path $certificatePath)) {
              throw "NetSpeed.cer not found."
          }

          $principal = New-Object `
              Security.Principal.WindowsPrincipal(
                  [Security.Principal.WindowsIdentity]::GetCurrent()
              )

          $isAdmin = $principal.IsInRole(
              [Security.Principal.WindowsBuiltInRole]::Administrator
          )

          if (-not $isAdmin) {
              throw "Run Install-Package.ps1 from PowerShell as Administrator."
          }

          Write-Host "Installing NetSpeed signing certificate..."

          Import-Certificate `
              -FilePath $certificatePath `
              -CertStoreLocation "Cert:\LocalMachine\TrustedPeople" |
              Out-Null

          Write-Host "Installing NetSpeed: $PackagePath"
          Add-AppxPackage -Path $PackagePath
          Write-Host "NetSpeed installed successfully."
          '@ | Set-Content "$dist\Install-Package.ps1" -Encoding UTF8

          Get-ChildItem -Path $dist | Select-Object Name, Length

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: NetSpeed-${{ matrix.platform }}
          path: dist/${{ matrix.platform }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - build
    runs-on: ubuntu-latest

    steps:
      - name: Download x64 artifact
        uses: actions/download-artifact@v4
        with:
          name: NetSpeed-x64
          path: release-assets/x64

      - name: Download ARM64 artifact
        uses: actions/download-artifact@v4
        with:
          name: NetSpeed-ARM64
          path: release-assets/arm64

      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${GITHUB_REF_NAME#v}"

          mkdir -p final-release

          cp "release-assets/x64/NetSpeed_x64.msix" "final-release/NetSpeed_${VERSION}_x64.msix"
          cp "release-assets/arm64/NetSpeed_ARM64.msix" "final-release/NetSpeed_${VERSION}_arm64.msix"
          cp "release-assets/x64/NetSpeed.cer" "final-release/NetSpeed.cer"
          cp "release-assets/x64/Install-Package.ps1" "final-release/Install-Package.ps1"

          ls -lah final-release

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${GITHUB_REF_NAME#v}"

          gh release create "${GITHUB_REF_NAME}" `
            "final-release/NetSpeed_${VERSION}_x64.msix" `
            "final-release/NetSpeed_${VERSION}_arm64.msix" `
            "final-release/NetSpeed.cer" `
            "final-release/Install-Package.ps1" `
            --repo "${GITHUB_REPOSITORY}" `
            --title "NetSpeed ${GITHUB_REF_NAME}" `
            --generate-notes
