name: Build NetSpeed

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  DOTNET_VERSION: "10.0.x"
  PROJECT_PATH: "NetSpeed/NetSpeed.csproj"
  LIBRESPEED_VERSION: "1.0.13"

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: x64
            runtime: win-x64
            librespeed_arch: amd64
          - platform: ARM64
            runtime: win-arm64
            librespeed_arch: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore "${{ env.PROJECT_PATH }}"

      - name: Download LibreSpeed CLI
        shell: pwsh
        run: |
          $version = "${{ env.LIBRESPEED_VERSION }}"
          $arch = "${{ matrix.librespeed_arch }}"

          $file = "librespeed-cli_${version}_windows_${arch}.zip"
          $baseUrl = "https://github.com/librespeed/speedtest-cli/releases/download/v${version}"

          $zipUrl = "$baseUrl/$file"
          $checksumsUrl = "$baseUrl/checksums.txt"

          Write-Host "Downloading $zipUrl"

          Invoke-WebRequest `
            -Uri $zipUrl `
            -OutFile $file

          Invoke-WebRequest `
            -Uri $checksumsUrl `
            -OutFile "checksums.txt"

          $checksumLine = Get-Content "checksums.txt" |
            Where-Object { $_ -match [regex]::Escape($file) } |
            Select-Object -First 1

          if (-not $checksumLine) {
            throw "Checksum for $file not found."
          }

          $expected = ($checksumLine -split '\s+')[0].Trim().ToLowerInvariant()
          $actual = (Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant()

          Write-Host "Expected SHA256: $expected"
          Write-Host "Actual SHA256:   $actual"

          if ($expected -ne $actual) {
            throw "LibreSpeed CLI checksum mismatch."
          }

          $target = "NetSpeed\ThirdParty\LibreSpeed"

          New-Item `
            -ItemType Directory `
            -Force `
            -Path $target | Out-Null

          Expand-Archive `
            -Path $file `
            -DestinationPath $target `
            -Force

          Get-ChildItem $target -Recurse

      - name: Build MSIX
        shell: pwsh
        run: |
          dotnet publish "${{ env.PROJECT_PATH }}" `
            -c Release `
            -p:Platform=${{ matrix.platform }} `
            -r ${{ matrix.runtime }} `
            -p:GenerateAppxPackageOnBuild=true `
            -p:AppxPackageSigningEnabled=false

      - name: Find MSIX
        id: package
        shell: pwsh
        run: |
          $msix = Get-ChildItem `
            -Path . `
            -Recurse `
            -Include *.msix `
            -File |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1

          if (-not $msix) {
            throw "No MSIX package found."
          }

          Write-Host "Found MSIX: $($msix.FullName)"

          "path=$($msix.FullName)" >> $env:GITHUB_OUTPUT
          "name=$($msix.Name)" >> $env:GITHUB_OUTPUT

      # ---------------------------------------------------------
      # RELEASE SIGNING
      #
      # For tagged releases a persistent PFX is REQUIRED.
      #
      # Repository secrets:
      #
      # NETSPEED_PFX_BASE64
      # NETSPEED_PFX_PASSWORD
      # ---------------------------------------------------------

      - name: Require persistent signing certificate for releases
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          PFX_BASE64: ${{ secrets.NETSPEED_PFX_BASE64 }}
          PFX_PASSWORD: ${{ secrets.NETSPEED_PFX_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:PFX_BASE64)) {
            throw "NETSPEED_PFX_BASE64 is required for tagged releases."
          }

          if ([string]::IsNullOrWhiteSpace($env:PFX_PASSWORD)) {
            throw "NETSPEED_PFX_PASSWORD is required for tagged releases."
          }

      - name: Prepare persistent certificate
        if: ${{ secrets.NETSPEED_PFX_BASE64 != '' }}
        shell: pwsh
        env:
          PFX_BASE64: ${{ secrets.NETSPEED_PFX_BASE64 }}
          PFX_PASSWORD: ${{ secrets.NETSPEED_PFX_PASSWORD }}
        run: |
          $bytes = [Convert]::FromBase64String($env:PFX_BASE64)
          $pfxPath = Join-Path $env:RUNNER_TEMP "NetSpeed.pfx"

          [IO.File]::WriteAllBytes($pfxPath, $bytes)

          "NETSPEED_PFX_PATH=$pfxPath" >> $env:GITHUB_ENV
          "NETSPEED_CERT_PASSWORD=$env:PFX_PASSWORD" >> $env:GITHUB_ENV

      - name: Create temporary development certificate
        if: ${{ secrets.NETSPEED_PFX_BASE64 == '' && !startsWith(github.ref, 'refs/tags/') }}
        shell: pwsh
        run: |
          [xml]$manifest = Get-Content "NetSpeed\Package.appxmanifest"

          $publisher = $manifest.Package.Identity.Publisher

          if ([string]::IsNullOrWhiteSpace($publisher)) {
            throw "Unable to read Publisher from Package.appxmanifest."
          }

          Write-Host "Creating temporary certificate for:"
          Write-Host $publisher

          $passwordText = [Guid]::NewGuid().ToString("N") + "Aa1!"
          $password = ConvertTo-SecureString `
            $passwordText `
            -AsPlainText `
            -Force

          $cert = New-SelfSignedCertificate `
            -Type Custom `
            -Subject $publisher `
            -KeyUsage DigitalSignature `
            -FriendlyName "NetSpeed GitHub Actions Development" `
            -CertStoreLocation "Cert:\CurrentUser\My" `
            -TextExtension @(
              "2.5.29.37={text}1.3.6.1.5.5.7.3.3"
            )

          $pfxPath = Join-Path $env:RUNNER_TEMP "NetSpeed-development.pfx"
          $cerPath = Join-Path $env:RUNNER_TEMP "NetSpeed-development.cer"

          Export-PfxCertificate `
            -Cert $cert `
            -FilePath $pfxPath `
            -Password $password | Out-Null

          Export-Certificate `
            -Cert $cert `
            -FilePath $cerPath | Out-Null

          "NETSPEED_PFX_PATH=$pfxPath" >> $env:GITHUB_ENV
          "NETSPEED_CERT_PASSWORD=$passwordText" >> $env:GITHUB_ENV
          "NETSPEED_CER_PATH=$cerPath" >> $env:GITHUB_ENV

      - name: Export public certificate from persistent PFX
        if: ${{ secrets.NETSPEED_PFX_BASE64 != '' }}
        shell: pwsh
        run: |
          $password = ConvertTo-SecureString `
            $env:NETSPEED_CERT_PASSWORD `
            -AsPlainText `
            -Force

          $cert = New-Object `
            System.Security.Cryptography.X509Certificates.X509Certificate2(
              $env:NETSPEED_PFX_PATH,
              $env:NETSPEED_CERT_PASSWORD
            )

          $cerPath = Join-Path $env:RUNNER_TEMP "NetSpeed.cer"

          [IO.File]::WriteAllBytes(
            $cerPath,
            $cert.Export(
              [System.Security.Cryptography.X509Certificates.X509ContentType]::Cert
            )
          )

          "NETSPEED_CER_PATH=$cerPath" >> $env:GITHUB_ENV

      - name: Locate SignTool
        shell: pwsh
        run: |
          $signtool = Get-ChildItem `
            "C:\Program Files (x86)\Windows Kits\10\bin" `
            -Filter signtool.exe `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Where-Object {
              $_.FullName -match "\\x64\\signtool\.exe$"
            } |
            Sort-Object FullName -Descending |
            Select-Object -First 1

          if (-not $signtool) {
            throw "signtool.exe not found."
          }

          Write-Host "Using $($signtool.FullName)"

          "SIGNTOOL=$($signtool.FullName)" >> $env:GITHUB_ENV

      - name: Sign MSIX
        shell: pwsh
        run: |
          & "$env:SIGNTOOL" sign `
            /fd SHA256 `
            /f "$env:NETSPEED_PFX_PATH" `
            /p "$env:NETSPEED_CERT_PASSWORD" `
            "${{ steps.package.outputs.path }}"

          if ($LASTEXITCODE -ne 0) {
            throw "SignTool failed."
          }

      - name: Verify signature
        shell: pwsh
        run: |
          & "$env:SIGNTOOL" verify `
            /pa `
            /v `
            "${{ steps.package.outputs.path }}"

          if ($LASTEXITCODE -ne 0) {
            throw "MSIX signature verification failed."
          }

      - name: Prepare distribution files
        shell: pwsh
        run: |
          $dist = "dist\${{ matrix.platform }}"

          New-Item `
            -ItemType Directory `
            -Force `
            -Path $dist | Out-Null

          Copy-Item `
            "${{ steps.package.outputs.path }}" `
            "$dist\NetSpeed_${{ matrix.platform }}.msix"

          Copy-Item `
            "$env:NETSPEED_CER_PATH" `
            "$dist\NetSpeed.cer"

          @'
          param(
              [string]$PackagePath
          )

          $ErrorActionPreference = "Stop"

          $scriptDir = Split-Path -Parent $MyInvocation.MyCommand.Path

          if (-not $PackagePath) {
              $PackagePath = Get-ChildItem `
                  -Path $scriptDir `
                  -Filter "*.msix" |
                  Select-Object -First 1 -ExpandProperty FullName
          }

          $certificatePath = Join-Path $scriptDir "NetSpeed.cer"

          Write-Host "Installing NetSpeed certificate..."

          Import-Certificate `
              -FilePath $certificatePath `
              -CertStoreLocation "Cert:\LocalMachine\TrustedPeople" |
              Out-Null

          Write-Host "Installing $PackagePath..."

          Add-AppxPackage -Path $PackagePath

          Write-Host ""
          Write-Host "NetSpeed installed successfully."
          '@ | Set-Content `
            "$dist\Install-Package.ps1" `
            -Encoding UTF8

      - name: Upload CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: NetSpeed-${{ matrix.platform }}
          path: dist/${{ matrix.platform }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - build

    runs-on: ubuntu-latest

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v5
        with:
          pattern: NetSpeed-*
          path: release-assets
          merge-multiple: true

      - name: Show release files
        run: find release-assets -type f -maxdepth 2 -print

      - name: Rename release files with tag version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"

          if [ -f "release-assets/NetSpeed_x64.msix" ]; then
            mv \
              "release-assets/NetSpeed_x64.msix" \
              "release-assets/NetSpeed_${VERSION}_x64.msix"
          fi

          if [ -f "release-assets/NetSpeed_ARM64.msix" ]; then
            mv \
              "release-assets/NetSpeed_ARM64.msix" \
              "release-assets/NetSpeed_${VERSION}_arm64.msix"
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            release-assets/*.msix \
            release-assets/NetSpeed.cer \
            --repo "${GITHUB_REPOSITORY}" \
            --title "NetSpeed ${GITHUB_REF_NAME}" \
            --generate-notes