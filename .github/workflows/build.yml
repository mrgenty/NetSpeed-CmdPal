name: NetSpeed Debug CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  DOTNET_VERSION: "10.0.x"
  PROJECT_PATH: "NetSpeed/NetSpeed.csproj"
  LIBRESPEED_VERSION: "1.0.13"

jobs:
  debug:
    name: Debug ${{ matrix.platform }}
    runs-on: windows-2025

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: x64
            runtime: win-x64
            librespeed_arch: amd64
          - platform: ARM64
            runtime: win-arm64
            librespeed_arch: arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore and audit NuGet packages
        shell: pwsh
        run: |
          dotnet restore "${{ env.PROJECT_PATH }}" -p:NuGetAuditMode=all -warnaserror:NU1901,NU1902,NU1903,NU1904
          if ($LASTEXITCODE -ne 0) { throw "dotnet restore failed." }

      - name: Download and verify LibreSpeed CLI
        shell: pwsh
        run: |
          $version = "${{ env.LIBRESPEED_VERSION }}"
          $arch = "${{ matrix.librespeed_arch }}"
          $file = "librespeed-cli_${version}_windows_${arch}.zip"
          $baseUrl = "https://github.com/librespeed/speedtest-cli/releases/download/v${version}"

          Invoke-WebRequest -Uri "$baseUrl/$file" -OutFile $file
          Invoke-WebRequest -Uri "$baseUrl/checksums.txt" -OutFile "checksums.txt"

          $checksumLine = Get-Content "checksums.txt" | Where-Object { $_ -match [regex]::Escape($file) } | Select-Object -First 1
          if (-not $checksumLine) { throw "Checksum for $file not found." }

          $expected = ($checksumLine -split '\s+')[0].Trim().ToLowerInvariant()
          $actual = (Get-FileHash -Path $file -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($expected -ne $actual) { throw "LibreSpeed CLI checksum mismatch." }

          $target = "NetSpeed\ThirdParty\LibreSpeed"
          Remove-Item -Path $target -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $target | Out-Null
          Expand-Archive -Path $file -DestinationPath $target -Force
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/librespeed/speedtest-cli/v${version}/LICENSE" -OutFile "$target\LICENSE-LGPL-3.0.txt"

      - name: Build Debug MSIX
        shell: pwsh
        run: |
          dotnet publish "${{ env.PROJECT_PATH }}" `
            -c Debug `
            -p:Platform=${{ matrix.platform }} `
            -r ${{ matrix.runtime }} `
            -p:GenerateAppxPackageOnBuild=true `
            -p:AppxPackageSigningEnabled=false
          if ($LASTEXITCODE -ne 0) { throw "dotnet publish failed." }

      - name: Find generated MSIX
        id: package
        shell: pwsh
        run: |
          $msix = Get-ChildItem -Path . -Recurse -Filter "*.msix" -File | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $msix) { throw "No MSIX package was generated." }
          "path=$($msix.FullName)" >> $env:GITHUB_OUTPUT

      - name: Create temporary CI certificate
        shell: pwsh
        run: |
          [xml]$manifest = Get-Content "NetSpeed\Package.appxmanifest"
          $publisher = $manifest.Package.Identity.Publisher
          $password = [Guid]::NewGuid().ToString("N") + "Aa1!"
          $securePassword = ConvertTo-SecureString $password -AsPlainText -Force

          $cert = New-SelfSignedCertificate `
            -Type Custom `
            -Subject $publisher `
            -KeyAlgorithm RSA `
            -KeyLength 3072 `
            -HashAlgorithm SHA256 `
            -KeyUsage DigitalSignature `
            -FriendlyName "NetSpeed Temporary CI Certificate" `
            -CertStoreLocation "Cert:\CurrentUser\My" `
            -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3")

          $pfx = Join-Path $env:RUNNER_TEMP "NetSpeed-Debug.pfx"
          Export-PfxCertificate -Cert $cert -FilePath $pfx -Password $securePassword | Out-Null
          "SIGNING_PFX=$pfx" >> $env:GITHUB_ENV
          "SIGNING_PASSWORD=$password" >> $env:GITHUB_ENV

      - name: Locate SignTool
        shell: pwsh
        run: |
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Filter "signtool.exe" -Recurse -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match "\\x64\\signtool\.exe$" } |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $signtool) { throw "signtool.exe not found." }
          "SIGNTOOL=$($signtool.FullName)" >> $env:GITHUB_ENV

      - name: Sign Debug MSIX with temporary certificate
        shell: pwsh
        run: |
          & "$env:SIGNTOOL" sign /fd SHA256 /f "$env:SIGNING_PFX" /p "$env:SIGNING_PASSWORD" "${{ steps.package.outputs.path }}"
          if ($LASTEXITCODE -ne 0) { throw "Debug MSIX signing failed." }

      - name: Upload Debug MSIX
        uses: actions/upload-artifact@v4
        with:
          name: NetSpeed-Debug-${{ matrix.platform }}
          path: ${{ steps.package.outputs.path }}
          if-no-files-found: error
          retention-days: 14
