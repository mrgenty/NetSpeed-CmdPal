name: Build NetSpeed

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  DOTNET_VERSION: "10.0.x"
  PROJECT_PATH: "NetSpeed/NetSpeed.csproj"
  LIBRESPEED_VERSION: "1.0.13"

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: windows-latest

    env:
      PFX_BASE64: ${{ secrets.NETSPEED_PFX_BASE64 }}
      PFX_PASSWORD: ${{ secrets.NETSPEED_PFX_PASSWORD }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: x64
            runtime: win-x64
            librespeed_arch: amd64

          - platform: ARM64
            runtime: win-arm64
            librespeed_arch: arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore NuGet packages
        run: dotnet restore "${{ env.PROJECT_PATH }}"

      # ------------------------------------------------------------
      # LibreSpeed CLI
      # ------------------------------------------------------------

      - name: Download LibreSpeed CLI
        shell: pwsh
        run: |
          $version = "${{ env.LIBRESPEED_VERSION }}"
          $arch = "${{ matrix.librespeed_arch }}"

          $file = "librespeed-cli_${version}_windows_${arch}.zip"
          $baseUrl = "https://github.com/librespeed/speedtest-cli/releases/download/v${version}"

          $zipUrl = "$baseUrl/$file"
          $checksumsUrl = "$baseUrl/checksums.txt"

          Write-Host "Downloading LibreSpeed CLI:"
          Write-Host $zipUrl

          Invoke-WebRequest `
            -Uri $zipUrl `
            -OutFile $file

          Invoke-WebRequest `
            -Uri $checksumsUrl `
            -OutFile "checksums.txt"

          $checksumLine = Get-Content "checksums.txt" |
            Where-Object { $_ -match [regex]::Escape($file) } |
            Select-Object -First 1

          if (-not $checksumLine) {
            throw "Checksum for $file not found."
          }

          $expected = ($checksumLine -split '\s+')[0].Trim().ToLowerInvariant()
          $actual = (Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant()

          Write-Host "Expected SHA256: $expected"
          Write-Host "Actual SHA256:   $actual"

          if ($expected -ne $actual) {
            throw "LibreSpeed CLI checksum mismatch."
          }

          $target = "NetSpeed\ThirdParty\LibreSpeed"

          Remove-Item `
            -Path $target `
            -Recurse `
            -Force `
            -ErrorAction SilentlyContinue

          New-Item `
            -ItemType Directory `
            -Force `
            -Path $target |
            Out-Null

          Expand-Archive `
            -Path $file `
            -DestinationPath $target `
            -Force

          Write-Host "LibreSpeed files:"
          Get-ChildItem $target -Recurse

      # ------------------------------------------------------------
      # Build MSIX unsigned
      # ------------------------------------------------------------

      - name: Build MSIX
        shell: pwsh
        run: |
          dotnet publish "${{ env.PROJECT_PATH }}" `
            -c Release `
            -p:Platform=${{ matrix.platform }} `
            -r ${{ matrix.runtime }} `
            -p:GenerateAppxPackageOnBuild=true `
            -p:AppxPackageSigningEnabled=false

      - name: Find generated MSIX
        id: package
        shell: pwsh
        run: |
          $msix = Get-ChildItem `
            -Path . `
            -Recurse `
            -Filter "*.msix" `
            -File |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1

          if (-not $msix) {
            throw "No MSIX package found."
          }

          Write-Host "MSIX found:"
          Write-Host $msix.FullName

          "path=$($msix.FullName)" >> $env:GITHUB_OUTPUT

      # ------------------------------------------------------------
      # Signing certificate
      #
      # RELEASE:
      # Persistent PFX is mandatory.
      #
      # NORMAL CI BUILD:
      # If no persistent PFX exists, generate a temporary certificate.
      # ------------------------------------------------------------

      - name: Verify release signing secrets
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:PFX_BASE64)) {
            throw "NETSPEED_PFX_BASE64 is missing. Tagged releases require the persistent signing certificate."
          }

          if ([string]::IsNullOrWhiteSpace($env:PFX_PASSWORD)) {
            throw "NETSPEED_PFX_PASSWORD is missing. Tagged releases require the PFX password."
          }

          Write-Host "Persistent signing certificate configured."

      - name: Restore persistent signing certificate
        if: env.PFX_BASE64 != ''
        shell: pwsh
        run: |
          $pfxPath = Join-Path $env:RUNNER_TEMP "NetSpeed-CodeSigning.pfx"

          try {
            $bytes = [Convert]::FromBase64String($env:PFX_BASE64)
          }
          catch {
            throw "NETSPEED_PFX_BASE64 does not contain valid Base64."
          }

          [IO.File]::WriteAllBytes($pfxPath, $bytes)

          if (-not (Test-Path $pfxPath)) {
            throw "Could not reconstruct PFX."
          }

          Write-Host "Persistent PFX restored."

          "SIGNING_PFX=$pfxPath" >> $env:GITHUB_ENV

      - name: Create temporary CI certificate
        if: env.PFX_BASE64 == '' && !startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          [xml]$manifest = Get-Content "NetSpeed\Package.appxmanifest"

          $publisher = $manifest.Package.Identity.Publisher

          if ([string]::IsNullOrWhiteSpace($publisher)) {
            throw "Unable to determine Publisher from Package.appxmanifest."
          }

          Write-Host "Creating temporary CI certificate for:"
          Write-Host $publisher

          $temporaryPassword = [Guid]::NewGuid().ToString("N") + "Aa1!"

          $securePassword = ConvertTo-SecureString `
            $temporaryPassword `
            -AsPlainText `
            -Force

          $cert = New-SelfSignedCertificate `
            -Type Custom `
            -Subject $publisher `
            -KeyAlgorithm RSA `
            -KeyLength 2048 `
            -HashAlgorithm SHA256 `
            -KeyUsage DigitalSignature `
            -FriendlyName "NetSpeed Temporary CI Certificate" `
            -CertStoreLocation "Cert:\CurrentUser\My" `
            -TextExtension @(
              "2.5.29.37={text}1.3.6.1.5.5.7.3.3"
            )

          $pfxPath = Join-Path $env:RUNNER_TEMP "NetSpeed-Temporary.pfx"
          $cerPath = Join-Path $env:RUNNER_TEMP "NetSpeed-Temporary.cer"

          Export-PfxCertificate `
            -Cert $cert `
            -FilePath $pfxPath `
            -Password $securePassword |
            Out-Null

          Export-Certificate `
            -Cert $cert `
            -FilePath $cerPath |
            Out-Null

          "SIGNING_PFX=$pfxPath" >> $env:GITHUB_ENV
          "SIGNING_PASSWORD=$temporaryPassword" >> $env:GITHUB_ENV
          "PUBLIC_CERT=$cerPath" >> $env:GITHUB_ENV

      - name: Configure persistent PFX password
        if: env.PFX_BASE64 != ''
        shell: pwsh
        run: |
          "SIGNING_PASSWORD=$env:PFX_PASSWORD" >> $env:GITHUB_ENV

      # ------------------------------------------------------------
      # Export .CER from persistent PFX
      # ------------------------------------------------------------

      - name: Export public certificate
        if: env.PFX_BASE64 != ''
        shell: pwsh
        run: |
          $cert = New-Object `
            System.Security.Cryptography.X509Certificates.X509Certificate2(
              $env:SIGNING_PFX,
              $env:PFX_PASSWORD
            )

          $cerPath = Join-Path $env:RUNNER_TEMP "NetSpeed.cer"

          $bytes = $cert.Export(
            [System.Security.Cryptography.X509Certificates.X509ContentType]::Cert
          )

          [IO.File]::WriteAllBytes($cerPath, $bytes)

          Write-Host "Public certificate exported."

          "PUBLIC_CERT=$cerPath" >> $env:GITHUB_ENV

      # ------------------------------------------------------------
      # SignTool
      # ------------------------------------------------------------

      - name: Locate SignTool
        shell: pwsh
        run: |
          $signtool = Get-ChildItem `
            "C:\Program Files (x86)\Windows Kits\10\bin" `
            -Filter "signtool.exe" `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Where-Object {
              $_.FullName -match "\\x64\\signtool\.exe$"
            } |
            Sort-Object FullName -Descending |
            Select-Object -First 1

          if (-not $signtool) {
            throw "signtool.exe not found."
          }

          Write-Host "Using SignTool:"
          Write-Host $signtool.FullName

          "SIGNTOOL=$($signtool.FullName)" >> $env:GITHUB_ENV

      - name: Sign MSIX
        shell: pwsh
        run: |
          & "$env:SIGNTOOL" sign `
            /fd SHA256 `
            /f "$env:SIGNING_PFX" `
            /p "$env:SIGNING_PASSWORD" `
            "${{ steps.package.outputs.path }}"

          if ($LASTEXITCODE -ne 0) {
            throw "MSIX signing failed."
          }

      - name: Verify MSIX signature
        shell: pwsh
        run: |
          & "$env:SIGNTOOL" verify `
            /pa `
            /v `
            "${{ steps.package.outputs.path }}"

          if ($LASTEXITCODE -ne 0) {
            throw "MSIX signature verification failed."
          }

      # ------------------------------------------------------------
      # Distribution files
      # ------------------------------------------------------------

      - name: Prepare distribution
        shell: pwsh
        run: |
          $dist = "dist\${{ matrix.platform }}"

          New-Item `
            -ItemType Directory `
            -Force `
            -Path $dist |
            Out-Null

          $outputName = "NetSpeed_${{ matrix.platform }}.msix"

          Copy-Item `
            "${{ steps.package.outputs.path }}" `
            "$dist\$outputName"

          Copy-Item `
            "$env:PUBLIC_CERT" `
            "$dist\NetSpeed.cer"

          @'
          param(
              [string]$PackagePath
          )

          $ErrorActionPreference = "Stop"

          $scriptDir = Split-Path -Parent $MyInvocation.MyCommand.Path

          if (-not $PackagePath) {
              $PackagePath = Get-ChildItem `
                  -Path $scriptDir `
                  -Filter "*.msix" `
                  -File |
                  Select-Object -First 1 -ExpandProperty FullName
          }

          if (-not $PackagePath) {
              throw "MSIX package not found."
          }

          $certificatePath = Join-Path $scriptDir "NetSpeed.cer"

          if (-not (Test-Path $certificatePath)) {
              throw "NetSpeed.cer not found."
          }

          Write-Host "Installing NetSpeed signing certificate..."

          Import-Certificate `
              -FilePath $certificatePath `
              -CertStoreLocation "Cert:\LocalMachine\TrustedPeople" |
              Out-Null

          Write-Host "Installing:"
          Write-Host $PackagePath

          Add-AppxPackage -Path $PackagePath

          Write-Host ""
          Write-Host "NetSpeed installed successfully."
          '@ | Set-Content `
            "$dist\Install-Package.ps1" `
            -Encoding UTF8

          Write-Host "Distribution contents:"
          Get-ChildItem $dist

      # ------------------------------------------------------------
      # CI artifacts
      # ------------------------------------------------------------

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: NetSpeed-${{ matrix.platform }}
          path: dist/${{ matrix.platform }}
          if-no-files-found: error
          retention-days: 14

  # ==============================================================
  # GitHub Release
  # Runs ONLY for tags such as v0.1.2
  # ==============================================================

  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - build

    runs-on: ubuntu-latest

    steps:
      - name: Download x64 artifact
        uses: actions/download-artifact@v4
        with:
          name: NetSpeed-x64
          path: release-assets/x64

      - name: Download ARM64 artifact
        uses: actions/download-artifact@v4
        with:
          name: NetSpeed-ARM64
          path: release-assets/arm64

      - name: Prepare release assets
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"

          mkdir -p final-release

          cp \
            "release-assets/x64/NetSpeed_x64.msix" \
            "final-release/NetSpeed_${VERSION}_x64.msix"

          cp \
            "release-assets/arm64/NetSpeed_ARM64.msix" \
            "final-release/NetSpeed_${VERSION}_arm64.msix"

          cp \
            "release-assets/x64/NetSpeed.cer" \
            "final-release/NetSpeed.cer"

          cp \
            "release-assets/x64/Install-Package.ps1" \
            "final-release/Install-Package.ps1"

          echo "Release assets:"
          ls -lah final-release

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            final-release/NetSpeed_${GITHUB_REF_NAME#v}_x64.msix \
            final-release/NetSpeed_${GITHUB_REF_NAME#v}_arm64.msix \
            final-release/NetSpeed.cer \
            final-release/Install-Package.ps1 \
            --repo "${GITHUB_REPOSITORY}" \
            --title "NetSpeed ${GITHUB_REF_NAME}" \
            --generate-notes
