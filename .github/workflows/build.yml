name: Build NetSpeed

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  DOTNET_VERSION: "10.0.x"
  PROJECT_PATH: "NetSpeed/NetSpeed.csproj"
  LIBRESPEED_VERSION: "1.0.13"

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: windows-latest

    env:
      PFX_BASE64: ${{ secrets.NETSPEED_PFX_BASE64 }}
      PFX_PASSWORD: ${{ secrets.NETSPEED_PFX_PASSWORD }}

    strategy:
      fail-fast: false

      matrix:
        include:
          - platform: x64
            runtime: win-x64
            librespeed_arch: amd64

          - platform: ARM64
            runtime: win-arm64
            librespeed_arch: arm64

    steps:
      # ============================================================
      # SOURCE
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore NuGet packages
        shell: pwsh
        run: |
          dotnet restore "${{ env.PROJECT_PATH }}"

      # ============================================================
      # LIBRESPEED CLI
      # ============================================================

      - name: Download LibreSpeed CLI
        shell: pwsh
        run: |
          $version = "${{ env.LIBRESPEED_VERSION }}"
          $arch = "${{ matrix.librespeed_arch }}"

          $file = "librespeed-cli_${version}_windows_${arch}.zip"

          $baseUrl = "https://github.com/librespeed/speedtest-cli/releases/download/v${version}"
          $zipUrl = "$baseUrl/$file"
          $checksumsUrl = "$baseUrl/checksums.txt"

          Write-Host ""
          Write-Host "========================================="
          Write-Host " LibreSpeed CLI"
          Write-Host "========================================="
          Write-Host "Version:      $version"
          Write-Host "Architecture: $arch"
          Write-Host "Download:     $zipUrl"
          Write-Host ""

          Invoke-WebRequest `
            -Uri $zipUrl `
            -OutFile $file

          Invoke-WebRequest `
            -Uri $checksumsUrl `
            -OutFile "checksums.txt"

          $checksumLine = Get-Content "checksums.txt" |
            Where-Object { $_ -match [regex]::Escape($file) } |
            Select-Object -First 1

          if (-not $checksumLine) {
            throw "Checksum for $file was not found in checksums.txt."
          }

          $expected = ($checksumLine -split '\s+')[0].Trim().ToLowerInvariant()
          $actual = (Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant()

          Write-Host "Expected SHA256: $expected"
          Write-Host "Actual SHA256:   $actual"

          if ($expected -ne $actual) {
            throw "LibreSpeed CLI SHA256 checksum mismatch."
          }

          Write-Host "Checksum OK."

          $target = "NetSpeed\ThirdParty\LibreSpeed"

          Remove-Item `
            -Path $target `
            -Recurse `
            -Force `
            -ErrorAction SilentlyContinue

          New-Item `
            -ItemType Directory `
            -Force `
            -Path $target |
            Out-Null

          Expand-Archive `
            -Path $file `
            -DestinationPath $target `
            -Force

          # Il progetto NetSpeed include questo file nel pacchetto.
          # La release ZIP di LibreSpeed non lo contiene con questo nome,
          # quindi lo scarichiamo direttamente dal tag upstream.
          Invoke-WebRequest `
            -Uri "https://raw.githubusercontent.com/librespeed/speedtest-cli/v${version}/LICENSE" `
            -OutFile "$target\LICENSE-LGPL-3.0.txt"

          if (-not (Test-Path "$target\LICENSE-LGPL-3.0.txt")) {
            throw "LibreSpeed LGPL license file was not downloaded."
          }

          Write-Host ""
          Write-Host "LibreSpeed files installed:"
          Get-ChildItem $target -Recurse |
            Select-Object FullName, Length

      # ============================================================
      # BUILD
      # ============================================================

      - name: Build MSIX
        shell: pwsh
        run: |
          Write-Host "Building NetSpeed for ${{ matrix.platform }}..."

          dotnet publish "${{ env.PROJECT_PATH }}" `
            -c Release `
            -p:Platform=${{ matrix.platform }} `
            -r ${{ matrix.runtime }} `
            -p:GenerateAppxPackageOnBuild=true `
            -p:AppxPackageSigningEnabled=false

          if ($LASTEXITCODE -ne 0) {
            throw "dotnet publish failed."
          }

      - name: Find generated MSIX
        id: package
        shell: pwsh
        run: |
          $msix = Get-ChildItem `
            -Path . `
            -Recurse `
            -Filter "*.msix" `
            -File |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1

          if (-not $msix) {
            throw "No MSIX package was generated."
          }

          Write-Host ""
          Write-Host "MSIX found:"
          Write-Host $msix.FullName

          "path=$($msix.FullName)" >> $env:GITHUB_OUTPUT
          "filename=$($msix.Name)" >> $env:GITHUB_OUTPUT

      # ============================================================
      # SIGNING
      #
      # Repository Secrets:
      #
      # NETSPEED_PFX_BASE64
      # NETSPEED_PFX_PASSWORD
      #
      # Tagged releases REQUIRE the persistent certificate.
      # Normal CI builds can fall back to a temporary certificate.
      # ============================================================

      - name: Verify release signing configuration
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:PFX_BASE64)) {
            throw "NETSPEED_PFX_BASE64 is missing. Tagged releases require the persistent signing certificate."
          }

          if ([string]::IsNullOrWhiteSpace($env:PFX_PASSWORD)) {
            throw "NETSPEED_PFX_PASSWORD is missing. Tagged releases require the PFX password."
          }

          Write-Host "Persistent release signing certificate is configured."

      # ------------------------------------------------------------
      # Persistent PFX
      # ------------------------------------------------------------

      - name: Restore persistent signing certificate
        if: env.PFX_BASE64 != ''
        shell: pwsh
        run: |
          Write-Host "Restoring persistent NetSpeed signing certificate..."

          $pfxPath = Join-Path `
            $env:RUNNER_TEMP `
            "NetSpeed-CodeSigning.pfx"

          try {
            $bytes = [Convert]::FromBase64String($env:PFX_BASE64)
          }
          catch {
            throw "NETSPEED_PFX_BASE64 does not contain valid Base64."
          }

          [IO.File]::WriteAllBytes(
            $pfxPath,
            $bytes
          )

          if (-not (Test-Path $pfxPath)) {
            throw "Could not reconstruct the PFX file."
          }

          if ((Get-Item $pfxPath).Length -eq 0) {
            throw "Reconstructed PFX is empty."
          }

          Write-Host "PFX restored successfully."

          "SIGNING_PFX=$pfxPath" >> $env:GITHUB_ENV
          "SIGNING_PASSWORD=$env:PFX_PASSWORD" >> $env:GITHUB_ENV

      - name: Export public certificate from persistent PFX
        if: env.PFX_BASE64 != ''
        shell: pwsh
        run: |
          Write-Host "Exporting public certificate..."

          try {
            $cert = [System.Security.Cryptography.X509Certificates.X509Certificate2]::new(
              $env:SIGNING_PFX,
              $env:SIGNING_PASSWORD
            )
          }
          catch {
            throw "Unable to open PFX. Check NETSPEED_PFX_PASSWORD."
          }

          Write-Host "Certificate subject:"
          Write-Host $cert.Subject

          Write-Host "Certificate thumbprint:"
          Write-Host $cert.Thumbprint

          $cerPath = Join-Path `
            $env:RUNNER_TEMP `
            "NetSpeed.cer"

          $certBytes = $cert.Export(
            [System.Security.Cryptography.X509Certificates.X509ContentType]::Cert
          )

          [IO.File]::WriteAllBytes(
            $cerPath,
            $certBytes
          )

          "PUBLIC_CERT=$cerPath" >> $env:GITHUB_ENV

      # ------------------------------------------------------------
      # Temporary certificate for CI only
      # ------------------------------------------------------------

      - name: Create temporary CI certificate
        if: env.PFX_BASE64 == '' && !startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          Write-Host "No persistent PFX configured."
          Write-Host "Creating temporary certificate for this CI build."

          [xml]$manifest = Get-Content `
            "NetSpeed\Package.appxmanifest"

          $publisher = $manifest.Package.Identity.Publisher

          if ([string]::IsNullOrWhiteSpace($publisher)) {
            throw "Unable to determine Publisher from Package.appxmanifest."
          }

          Write-Host "Publisher:"
          Write-Host $publisher

          $temporaryPassword = `
            [Guid]::NewGuid().ToString("N") + "Aa1!"

          $securePassword = ConvertTo-SecureString `
            $temporaryPassword `
            -AsPlainText `
            -Force

          $cert = New-SelfSignedCertificate `
            -Type Custom `
            -Subject $publisher `
            -KeyAlgorithm RSA `
            -KeyLength 2048 `
            -HashAlgorithm SHA256 `
            -KeyUsage DigitalSignature `
            -FriendlyName "NetSpeed Temporary CI Certificate" `
            -CertStoreLocation "Cert:\CurrentUser\My" `
            -TextExtension @(
              "2.5.29.37={text}1.3.6.1.5.5.7.3.3"
            )

          $pfxPath = Join-Path `
            $env:RUNNER_TEMP `
            "NetSpeed-Temporary.pfx"

          $cerPath = Join-Path `
            $env:RUNNER_TEMP `
            "NetSpeed-Temporary.cer"

          Export-PfxCertificate `
            -Cert $cert `
            -FilePath $pfxPath `
            -Password $securePassword |
            Out-Null

          Export-Certificate `
            -Cert $cert `
            -FilePath $cerPath |
            Out-Null

          "SIGNING_PFX=$pfxPath" >> $env:GITHUB_ENV
          "SIGNING_PASSWORD=$temporaryPassword" >> $env:GITHUB_ENV
          "PUBLIC_CERT=$cerPath" >> $env:GITHUB_ENV

      # ============================================================
      # SIGNTOOL
      # ============================================================

      - name: Locate SignTool
        shell: pwsh
        run: |
          $signtool = Get-ChildItem `
            "C:\Program Files (x86)\Windows Kits\10\bin" `
            -Filter "signtool.exe" `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Where-Object {
              $_.FullName -match "\\x64\\signtool\.exe$"
            } |
            Sort-Object FullName -Descending |
            Select-Object -First 1

          if (-not $signtool) {
            throw "signtool.exe was not found."
          }

          Write-Host "Using SignTool:"
          Write-Host $signtool.FullName

          "SIGNTOOL=$($signtool.FullName)" >> $env:GITHUB_ENV

      - name: Sign MSIX
        shell: pwsh
        run: |
          Write-Host "Signing:"
          Write-Host "${{ steps.package.outputs.path }}"

          & "$env:SIGNTOOL" sign `
            /fd SHA256 `
            /f "$env:SIGNING_PFX" `
            /p "$env:SIGNING_PASSWORD" `
            "${{ steps.package.outputs.path }}"

          if ($LASTEXITCODE -ne 0) {
            throw "MSIX signing failed."
          }

      - name: Verify MSIX signature
        shell: pwsh
        run: |
          & "$env:SIGNTOOL" verify `
            /pa `
            /v `
            "${{ steps.package.outputs.path }}"

          if ($LASTEXITCODE -ne 0) {
            throw "MSIX signature verification failed."
          }

          Write-Host "MSIX signature verified successfully."

      # ============================================================
      # DISTRIBUTION
      # ============================================================

      - name: Prepare distribution files
        shell: pwsh
        run: |
          $dist = "dist\${{ matrix.platform }}"

          Remove-Item `
            $dist `
            -Recurse `
            -Force `
            -ErrorAction SilentlyContinue

          New-Item `
            -ItemType Directory `
            -Force `
            -Path $dist |
            Out-Null

          $outputName = "NetSpeed_${{ matrix.platform }}.msix"

          Copy-Item `
            "${{ steps.package.outputs.path }}" `
            "$dist\$outputName"

          Copy-Item `
            "$env:PUBLIC_CERT" `
            "$dist\NetSpeed.cer"

          @'
          param(
              [string]$PackagePath
          )

          $ErrorActionPreference = "Stop"

          $scriptDir = Split-Path `
              -Parent `
              $MyInvocation.MyCommand.Path

          if (-not $PackagePath) {
              $PackagePath = Get-ChildItem `
                  -Path $scriptDir `
                  -Filter "*.msix" `
                  -File |
                  Select-Object `
                      -First 1 `
                      -ExpandProperty FullName
          }

          if (-not $PackagePath) {
              throw "MSIX package not found."
          }

          $certificatePath = Join-Path `
              $scriptDir `
              "NetSpeed.cer"

          if (-not (Test-Path $certificatePath)) {
              throw "NetSpeed.cer not found."
          }

          $isAdmin = (
              New-Object Security.Principal.WindowsPrincipal(
                  [Security.Principal.WindowsIdentity]::GetCurrent()
              )
          ).IsInRole(
              [Security.Principal.WindowsBuiltInRole]::Administrator
          )

          if (-not $isAdmin) {
              throw "Run this script from PowerShell as Administrator."
          }

          Write-Host ""
          Write-Host "Installing NetSpeed signing certificate..."

          Import-Certificate `
              -FilePath $certificatePath `
              -CertStoreLocation "Cert:\LocalMachine\TrustedPeople" |
              Out-Null

          Write-Host ""
          Write-Host "Installing NetSpeed:"
          Write-Host $PackagePath

          Add-AppxPackage `
              -Path $PackagePath

          Write-Host ""
          Write-Host "NetSpeed installed successfully."
          '@ | Set-Content `
            "$dist\Install-Package.ps1" `
            -Encoding UTF8

          Write-Host ""
          Write-Host "Distribution files:"
          Get-ChildItem $dist |
            Select-Object Name, Length

      # ============================================================
      # CI ARTIFACT
      # ============================================================

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: NetSpeed-${{ matrix.platform }}
          path: dist/${{ matrix.platform }}
          if-no-files-found: error
          retention-days: 14

  # ==============================================================
  # GITHUB RELEASE
  #
  # Runs only for tags:
  #
  # v0.1.2
  # v0.1.3
  # v1.0.0
  # ==============================================================

  release:
    name: Create GitHub Release

    if: startsWith(github.ref, 'refs/tags/')

    needs:
      - build

    runs-on: ubuntu-latest

    steps:
      - name: Download x64 artifact
        uses: actions/download-artifact@v4
        with:
          name: NetSpeed-x64
          path: release-assets/x64

      - name: Download ARM64 artifact
        uses: actions/download-artifact@v4
        with:
          name: NetSpeed-ARM64
          path: release-assets/arm64

      - name: Prepare release assets
        shell: bash
        run: |
          set -e

          VERSION="${GITHUB_REF_NAME#v}"

          echo "Preparing NetSpeed ${VERSION}"

          mkdir -p final-release

          cp \
            "release-assets/x64/NetSpeed_x64.msix" \
            "final-release/NetSpeed_${VERSION}_x64.msix"

          cp \
            "release-assets/arm64/NetSpeed_ARM64.msix" \
            "final-release/NetSpeed_${VERSION}_arm64.msix"

          cp \
            "release-assets/x64/NetSpeed.cer" \
            "final-release/NetSpeed.cer"

          cp \
            "release-assets/x64/Install-Package.ps1" \
            "final-release/Install-Package.ps1"

          echo ""
          echo "Release files:"
          ls -lah final-release

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}

        shell: bash

        run: |
          set -e

          VERSION="${GITHUB_REF_NAME#v}"

          gh release create "${GITHUB_REF_NAME}" \
            "final-release/NetSpeed_${VERSION}_x64.msix" \
            "final-release/NetSpeed_${VERSION}_arm64.msix" \
            "final-release/NetSpeed.cer" \
            "final-release/Install-Package.ps1" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "NetSpeed ${GITHUB_REF_NAME}" \
            --generate-notes
